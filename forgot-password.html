<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SmartFit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .forgot-container {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(107, 33, 168, 0.1);
            width: 100%;
            max-width: 420px;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-area h1 {
            color: #581c87;
            font-size: 24px;
        }
        .logo-area p {
            color: #6b7280;
            font-size: 13px;
        }
        .forgot-container h2 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d8b4fe;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #7e22ce;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background-color: #7e22ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #6b21a8;
        }
        .back-login {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #4b5563;
        }
        .back-login a {
            color: #7e22ce;
            text-decoration: none;
            font-weight: 600;
        }
        .back-login a:hover {
            text-decoration: underline;
        }
        /* Toast Notification Styling */
        #toast {
            visibility: hidden;
            min-width: 280px;
            background-color: #7e22ce;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 14px;
            position: fixed;
            z-index: 20;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div class="forgot-container">
        <div class="logo-area">
            <h1>Smart Fit</h1>
            <p>Your Size. Our Priority.</p>
        </div>
        <h2>Reset Your Password</h2>

        <form id="forgotForm">
            <div class="input-group">
                <label for="resetEmail">Registered Email Address</label>
                <input type="email" id="resetEmail" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="resetPassword">New Password</label>
                <input type="password" id="resetPassword" placeholder="Enter new password" required>
            </div>
            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <div class="back-login">
            Remember your password? <a href="login.html">Login here</a>
        </div>
    </div>

    <div id="toast">Password Updated!</div>

    <script>
        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.style.backgroundColor = isError ? "#dc2626" : "#7e22ce";
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('resetEmail').value.trim();
            const new_password = document.getElementById('resetPassword').value;

            try {
                const response = await fetch('http://127.0.0.1:8000/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, new_password })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast("✨ Password updated successfully! Redirecting...");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    showToast("❌ " + (data.detail || "Failed to update password"), true);
                }
            } catch (error) {
                console.error("Error:", error);
                showToast("⚠️ Network error occurred!", true);
            }
        });
    </script>
</body>
</html>
